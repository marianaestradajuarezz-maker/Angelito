<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Love. 💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #050508;
      color: #ffffff;
    }

    /* Pantalla Inicial de Entrada */
    #welcomeScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #050508;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .welcome-title {
      font-size: 2rem;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 117, 140, 0.4);
    }

    .start-btn {
      background: linear-gradient(135deg, #ffb6c1 0%, #ffc0cb 100%);
      color: #4a1525;
      border: none;
      padding: 16px 40px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 182, 193, 0.6);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 182, 193, 0.6); }
      50% { transform: scale(1.06); box-shadow: 0 0 35px rgba(255, 182, 193, 0.9); }
      100% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 182, 193, 0.6); }
    }

    .start-btn:hover {
      transform: scale(1.1);
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 20px;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 1s ease, transform 1s ease;
    }

    .main-container.show {
      opacity: 1;
      transform: scale(1);
    }

    .card {
      background: rgba(18, 18, 26, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 105, 180, 0.3);
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.2), inset 0 0 15px rgba(255, 105, 180, 0.1);
      border-radius: 24px;
      padding: 40px;
      max-width: 850px;
      width: 100%;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 30px;
    }

    @media (max-width: 768px) {
      .card {
        flex-direction: column-reverse;
        padding: 25px;
        max-height: 90vh;
        overflow-y: auto;
      }
    }

    .content-side {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .title {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 117, 140, 0.3);
    }

    .phrase-box {
      min-height: 80px;
      display: flex;
      align-items: center;
    }

    .phrase {
      font-size: 1.25rem;
      line-height: 1.6;
      color: #f0f0f0;
      font-style: italic;
    }

    .buttons-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      background: linear-gradient(135deg, #ffb6c1 0%, #ffc0cb 100%);
      color: #4a1525;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 7px 20px rgba(255, 182, 193, 0.6);
    }

    .gif-side {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .gif-container {
      width: 100%;
      max-width: 320px;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gif-container img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <main class="main-container" id="mainContent">

        <div class="phrase-box">
          <p class="phrase">Mi Angelito lindo, te amo. 💕</p>
        </div>

        <div class="buttons-group">
          <button class="btn" id="moreHeartsBtn">
            <span>Click!💖</span>
          </button>
        </div>
      </div>

      <div class="gif-side">
        <div class="gif-container">
          <img src="https://i.ibb.co/BV91Qf11/beso-ezgif-com-remove-background.gif" alt="Beso de Amor">
        </div>
      </div>
    </div>
  </main>
